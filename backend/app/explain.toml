# Thresholds for the vegetation-anomaly explanations (app/explain.py). All are judgment calls by the author,
# not fitted to data and not taken from the literature. Rainfall percentages are vs the median for the same
# weeks in other years; z values are seasonal z-scores (NASA POWER). Note: drought, late green-up, wet and
# flood all read the same rainfall statistics, so their ratings are NOT independent pieces of evidence.

[confidence]
low_if_warns_at_least = 3      # any failed check, or this many warnings -> low confidence
medium_if_warns_at_least = 1

[artifact]
good_fraction_below = 0.6      # "only X% of pixels rated good"
supported_if_reasons_at_least = 3

[drought]
event_rain_z_at_most = -1.0    # dry during the event: rain z <= this...
event_rain_pct_at_most = -20   # ...or rain % vs usual <= this
prior_rain_pct_at_most = -30   # dry in the month before
strong_rain_z_at_most = -1.5   # "supported" needs one of these stronger deficits
strong_rain_pct_at_most = -40
strong_prior_pct_at_most = -50
wet_rain_z_at_least = 0.5      # rainfall clearly not low

[greenup]
seasonal_rise_at_least = 0.05  # NDVI normally rises at least this much over the event window

[heat]
tmax_z_at_least = 1.5

[fire]
supported_if_burned_pct_at_least = 5.0   # MCD64A1 burned share of the box

[landcover]
persistent_composites_at_least = 3

[flood]
rain_z_at_least = 1.5          # below-normal NDVI after very heavy rain

[wet]                          # above-normal NDVI
event_rain_z_at_least = 1.0
event_rain_pct_at_least = 30
prior_rain_pct_at_least = 30
supported_pct_at_least = 50

[growth]
composites_at_least = 2
