# EarthOS hazard screening: every threshold in one place.
# These are screening values for discussion and calibration (see /backtest), not official criteria.
# Change a number here, restart the server, and the layers, the trigger and the backtest all follow.

[area]
default_half_km = 3.0        # screening box around any clicked place (half-width)
max_half_km = 8.0
buffer_km = 1.5              # extra terrain around the box so river routing doesn't stop at the edge
grid_arcsec = 1.0            # analysis grid spacing (1" ~ 31 m)

[forest_loss]
min_patch_ha = 0.5           # smallest patch reported (about 6 HLS pixels)
min_slope_deg = 15.0         # only flag loss on slopes steeper than this
ndvi_drop = 0.15             # current median NDVI at least this far below the baseline median...
robust_z = -2.0              # ...and at least 2 robust sigmas below it
recent_days = 90             # "current" window ending at the chosen date
baseline_pad_days = 15       # baseline = the same calendar window in prior years, widened by this on each side
baseline_years = 5           # how many prior years to use (fewer if the record is shorter)
min_baseline_obs = 3         # clear baseline observations a pixel needs to be judged
min_recent_obs = 2           # clear recent observations a pixel needs to be judged
max_scene_cloud_pct = 80     # skip scenes NASA reports as cloudier than this
# HLS Fmask bits that make a pixel unusable: 1 cloud, 2 adjacent to cloud/shadow, 3 cloud shadow, 4 snow/ice, 5 water
fmask_reject_bits = [1, 2, 3, 4, 5]

[susceptibility]
# Landslide part: slope classes (degrees) -> points
slope_breaks_deg = [15, 25, 35]          # <15: 0, 15-25: 1, 25-35: 2, >=35: 3
# Land-cover adjustment (ESA WorldCover classes), added to the slope points on slopes >= 15 deg
landcover_points = { tree = -0.5, shrub = 0.0, grass = 0.5, crop = 0.5, built = 0.5, bare = 1.0, water = 0.0, wetland = 0.0, other = 0.0 }
# Flood part: height above nearest drainage (m) -> points
hand_breaks_m = [2, 5, 10]               # <2: 3, 2-5: 2, 5-10: 1, >=10: 0
stream_area_km2 = 0.25                   # upstream area that defines a drainage line
# Combined score = max(landslide points, flood points) -> class
medium_from = 1.5
high_from = 2.5
# Uncertainty: a cell is "uncertain" if its class changes when the inputs move by their typical error
slope_error_deg = 3.0        # 30 m DEM slope error (SRTM, moderate relief)
hand_error_m = 2.0           # DEM vertical error carried into height above drainage
landcover_error_points = 0.5 # one land-cover class step

[trigger]
# Each level fires if ANY of its rules holds; a rule holds if ALL of its minimums are met.
# fc24 / fc72: forecast rain (mm) in the next 24 / 72 h. ante7: observed rain (mm) in the last 7 days.
# soil: root-zone soil wetness (0-1, NASA POWER GWETROOT).
watch = [
  { fc24 = 50 },
  { fc72 = 80 },
  { ante7 = 100, soil = 0.75, fc24 = 25 },
]
warning = [
  { fc24 = 90 },
  { fc72 = 150 },
  { ante7 = 150, soil = 0.80, fc24 = 50 },
]

[backtest]
radius_km = 25               # events within this distance of the place
match_days = 1               # an alert within +/- this many days of an event counts as a hit
start_year = 2001
split_year = 2011            # scores are also reported for an earlier block (< split_year) and a later block (>= split_year).
                             # The thresholds above were set by judgment, not fitted; any future tuning must use only the
                             # earlier block and be judged on the later one.
min_events_for_rate = 10     # rates from fewer events are shown greyed out ("too few events")
baseline_draws = 1000        # Monte Carlo draws for the random-days baseline
baseline_seed = 42           # fixed so the page shows the same numbers every time

[priority]
# "Where to inspect first": clusters of high-susceptibility cells, ranked by a transparent weighted score (0-1 parts).
block_m = 250                # sites are 250 m squares, small enough to walk and inspect
min_site_ha = 1.0            # a square is listed if it holds at least this much high-susceptibility ground
max_sites = 25
exposure_radius_m = 300      # built-up land within this distance counts as exposure
loss_radius_m = 150          # a forest-loss patch this close adds the "recent vegetation loss" factor
history_radius_m = 1000      # a reported landslide (location +/-1 km or better) this close adds the "history" factor
weights = { susceptibility = 0.35, exposure = 0.30, recent_loss = 0.15, history = 0.10, size = 0.10 }

# ---------------------------------------------------------------------------------------------------------------
# Where these numbers come from. origin: "judgment" (chosen by the author, not fitted or cited), "convention"
# (standard statistical practice), "product docs" (the data provider's documentation), "literature" (a published
# threshold, cited), "user choice" (set by the project owner). Nothing here was fitted to the validation events.
[provenance]
"area.grid_arcsec" = { origin = "product docs", note = "SRTM 1 arc-second (~30 m) is the native resolution of the terrain." }
"area.buffer_km" = { origin = "judgment", note = "Enough extra terrain that drainage routing rarely reaches the edge (0% unknown HAND in the pilot)." }
"forest_loss.min_patch_ha" = { origin = "user choice", note = "0.5 ha chosen by the project owner (about 6 HLS pixels)." }
"forest_loss.min_slope_deg" = { origin = "judgment", note = "Matches the lowest landslide slope class; the brief asked for slopes > 15 deg." }
"forest_loss.ndvi_drop" = { origin = "judgment", note = "Large enough to exceed typical HLS NDVI noise between clear views." }
"forest_loss.robust_z" = { origin = "convention", note = "2 robust sigmas, as in the anomaly detector; sigma = 1.4826 x MAD (consistent with a normal SD)." }
"forest_loss.fmask_reject_bits" = { origin = "product docs", note = "HLS v2 user guide Fmask bit definitions." }
"susceptibility.slope_breaks_deg" = { origin = "judgment", note = "Round-number classes; not taken from a calibrated landslide model." }
"susceptibility.landcover_points" = { origin = "judgment", note = "Trees stabilise slopes, bare/built/grass less so; sizes of the adjustments are not calibrated." }
"susceptibility.hand_breaks_m" = { origin = "judgment", note = "Low height above drainage floods first; break values not calibrated for local rivers." }
"susceptibility.stream_area_km2" = { origin = "judgment", note = "Chosen to give a plausible-looking network; not checked against mapped streams." }
"susceptibility.medium_from" = { origin = "judgment", note = "Class cut-offs on the 0-3 points scale." }
"susceptibility.slope_error_deg" = { origin = "judgment", note = "Typical slope error of a 30 m DEM in moderate relief; not measured here." }
"susceptibility.hand_error_m" = { origin = "judgment", note = "Typical SRTM vertical error carried into HAND; not measured here." }
"trigger.watch" = { origin = "judgment", note = "Starting values for the Santa Ana pilot, set before scoring; not official criteria, not fitted." }
"trigger.warning" = { origin = "judgment", note = "As above. The backtest shows they do no better than a rain-only threshold at the same frequency." }
"backtest.match_days" = { origin = "judgment", note = "Reported landslide dates are often a day off." }
"backtest.radius_km" = { origin = "judgment", note = "About half a NASA POWER rain cell." }
"priority.weights" = { origin = "judgment", note = "Not tuned; a +/-20% sensitivity check is reported on the Methods page." }
"priority.block_m" = { origin = "judgment", note = "Small enough for a team to walk in one visit." }
"change.NBR" = { origin = "literature", note = "dNBR >= 0.27 is 'moderate' burn severity (Key & Benson 2006, FIREMON)." }
"change.NDWI" = { origin = "judgment", note = "Index from McFeeters (1996); the 0.2 rise threshold is not from the literature." }
"anomaly.z" = { origin = "convention", note = "|z| >= 2 with sigma = 1.4826 x MAD; false-flag rate estimated on the Methods page." }
