# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo, then fill in the env vars.
services:
  - type: web
    name: earthos
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # An email or website, sent to OpenStreetMap Nominatim and MET Norway as their usage policies ask.
      - key: NOMINATIM_CONTACT
        sync: false
      # Optional: free Mapillary client token for more street-level photos.
      - key: MAPILLARY_TOKEN
        sync: false
      # Free NASA Earthdata token (urs.earthdata.nasa.gov > Generate Token): enables the 30 m forest-loss watch.
      - key: EARTHDATA_TOKEN
        sync: false
      # Optional: this site's own URL; the server pings itself so the free tier doesn't sleep.
      - key: KEEP_WARM_URL
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "240"
      # Proxies in front of the app that append to X-Forwarded-For (measured: 3). See /api/health -> xff_entries.
      - key: TRUSTED_PROXY_HOPS
        value: "3"
